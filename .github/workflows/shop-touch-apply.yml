name: Validate mobile shop input fix
on:
  push:
    branches: [fix/shop-touch-20260910]
    paths: [.github/workflows/shop-touch-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact browser-tested patch and validate JavaScript
        run: python3 maintenance/apply-shop-input.py
      - name: Commit tested HTML to fix branch only
        run: |
          git add -- index.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: prevent shop-opening touch from activating aura buttons'
          git push origin HEAD:refs/heads/fix/shop-touch-20260910
